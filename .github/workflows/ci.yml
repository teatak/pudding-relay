name: Relay CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: make test-install
      - run: make check
      - run: make build
      - run: ./bin/pudding-relay --version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Create test admin secret
        run: mkdir -p secrets && openssl rand -hex 32 > secrets/admin-secret
      - run: docker compose config --quiet
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Check HTTP endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:9623/healthz
          curl --fail --silent --show-error http://127.0.0.1:9623/version
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
      - name: Build installer test distribution
        run: |
          mkdir -p /tmp/relay-ui/assets
          printf '<!doctype html><base href="__PUDDING_REMOTE_BASE__"><script src="./assets/smoke.js"></script>' > /tmp/relay-ui/index.html
          printf '// installer fixture\n' > /tmp/relay-ui/assets/smoke.js
          mkdir -p /tmp/relay-ui/licenses
          printf 'Fixture license\n' > /tmp/relay-ui/licenses/PUDDING-LICENSE.txt
          docker build --build-context browser=/tmp/relay-ui -t pudding-relay:install-test .
      - name: Test real install and data preservation
        env:
          PUDDING_RELAY_TEST_IMAGE: pudding-relay:install-test
        run: make smoke-install
