services:
  relay:
    build:
      context: .
      target: server
    image: pudding-relay:local
    ports:
      - "127.0.0.1:${PUDDING_RELAY_PORT:-8080}:8080"
    environment:
      PUDDING_RELAY_TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      PUDDING_RELAY_ADMIN_SECRET_FILE: /run/secrets/admin_secret
    secrets:
      - admin_secret
    volumes:
      - relay_data:/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

secrets:
  admin_secret:
    file: "${PUDDING_RELAY_ADMIN_SECRET_FILE:-./secrets/admin-secret}"
volumes:
  relay_data:
